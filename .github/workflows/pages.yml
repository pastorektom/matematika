name: Nasazení na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sestavit složku dist (jen soubory aplikace)
        run: |
          mkdir dist
          rsync -a ./ dist/ \
            --exclude='.git' --exclude='.github' --exclude='.claude' --exclude='.superpowers' \
            --exclude='node_modules' --exclude='dist' --exclude='tests' --exclude='tools' \
            --exclude='docs' --exclude='README.md' --exclude='content' --exclude='Moodle_Matematika' \
            --exclude='package.json' --exclude='package-lock.json' --exclude='.gitignore' \
            --exclude='*.sql' --exclude='.env' --exclude='supabase'
          touch dist/.nojekyll
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" dist/sw.js
          grep -q "matika-static" dist/sw.js
          if grep -q "var BUILD = .__BUILD__" dist/sw.js; then echo "BUILD nenahrazeno"; exit 1; fi
          find dist -type f | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
